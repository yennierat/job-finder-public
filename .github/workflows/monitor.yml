name: monitor

# No schedule in this public copy: it would run every six hours without the
# secrets it needs and fail every time. Run your own copy on the cron in the
# comment below.
on:
  workflow_dispatch:     # schedule in a private copy: - cron: "0 */6 * * *"

# Two runs force-pushing the state branch at once corrupts it. Never cancel a
# run in progress either: it may have sent notifications it has not recorded yet.
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write        # required to push the state branch

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # state.db lives on an orphan branch, force-pushed each run, so history
      # holds exactly one copy instead of growing by ~12MB every 6 hours.
      # Seed only when the branch is absent; seeding after a failed fetch would
      # force-push an empty database over the real one.
      - name: Restore state
        run: |
          for attempt in 1 2 3; do
            rc=0
            git ls-remote --exit-code --heads origin state >/dev/null || rc=$?
            [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || [ "$attempt" -eq 3 ] && break
            sleep $((attempt * 10))
          done
          if [ "$rc" -eq 2 ]; then
            echo "no state branch yet — this run will seed"
            echo "SEED=--seed" >> "$GITHUB_ENV"
          elif [ "$rc" -ne 0 ]; then
            echo "::error::could not reach origin to restore state; not seeding"
            exit 1
          else
            git fetch origin state
            git checkout FETCH_HEAD -- state.db
            echo "restored $(du -h state.db | cut -f1) state.db"
          fi

      # Under the job timeout: a job timeout skips even `always()` steps, so
      # state would not be saved and no alert sent.
      - name: Run monitor
        timeout-minutes: 25
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # One session id per workflow run, so every LLM call this run makes is
          # filterable as a group on the OpenRouter dashboard.
          OPENROUTER_SESSION_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m src.run $SEED

      # A 90-day restore point, because a force-push has no undo. Due by a stamp
      # in state.db rather than a cron slot, so a skipped run only delays it.
      # Before Save state, so the stamp is saved with the database.
      - name: Check for weekly backup
        id: weekly
        if: always() && hashFiles('state.db') != ''
        run: >-
          python -c "from src import store;
          c = store.connect(); h = store.hours_since(c, 'last_state_backup');
          due = h is None or h >= 7 * 24;
          due and store.stamp(c, 'last_state_backup');
          print(f'due={str(due).lower()}')" >> "$GITHUB_OUTPUT"

      # Runs even if the monitor failed: it may have sent notifications before
      # dying, and losing those rows would re-notify every one of them next run.
      - name: Save state
        if: always()
        run: |
          if [ ! -f state.db ]; then echo "no state.db to save"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan state-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f state.db          # -f: .gitignore excludes it on main
          git commit -m "state $(date -u +%FT%TZ) run ${{ github.run_id }}"
          git push -f origin state-tmp:state

      - name: Weekly state backup
        if: always() && steps.weekly.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: state-db-${{ github.run_id }}
          path: state.db
          retention-days: 90

      # The only alert that survives the failure it reports.
      #
      # src/observability.py sends a heartbeat and a degraded-sources alert, but
      # both run at the END of src.run, so a run that is killed never reaches
      # them. On 2026-09-07 the primary model's free tier was withdrawn, runs
      # began exceeding the 30-minute limit, and the monitor went quiet for 36
      # hours — indistinguishable from a week with no matching jobs. This step
      # is curl rather than Python precisely so that nothing it depends on can
      # be killed along with the job: no interpreter, no imports, no database.
      #
      # `failure()` covers a crash, out-of-memory, a missing secret and the
      # monitor step's own timeout. A job timeout or cancel skips this step
      # entirely; monitor-watch.yml reports those. A run that never starts is
      # covered by the daily heartbeat and keepalive.yml.
      - name: Alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "::warning::Telegram secrets absent; cannot report this failure"
            exit 0
          fi
          # Built with printf rather than a literal multi-line string: inside a
          # YAML block scalar every line must stay indented, and an unindented
          # continuation silently ends the block and breaks the whole workflow.
          TEXT=$(printf '%s\n\n%s\n\n%s' \
            'Job monitor run FAILED' \
            'Either it did not finish, or it ended in systemic failure: most boards down, or not one verdict came back from any model. Nothing is lost - a posting with no verdict stays marked as owed one and is retried next run.' \
            "${URL}")

          # Never let a Telegram error fail this step. The run has already
          # failed; a second failure here would replace the original cause in
          # the UI with "could not send a message about it".
          curl -sS -m 30 -X POST \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}" \
            || echo "::warning::could not reach Telegram to report the failure"
